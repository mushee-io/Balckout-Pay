name: Dependency Cleanup

on:
  push:
    branches: ["hardening/recheck-27"]
    paths:
      - ".github/workflows/dependency-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/recheck-27

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Remove unused dependency paths
        run: npm uninstall express @types/express vite-plugin-top-level-await --ignore-scripts

      - name: Verify application and dependency audit
        run: |
          npm run ci
          npm audit --audit-level=moderate

      - name: Commit regenerated manifest and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): remove unused advisory paths"
          git push origin HEAD:hardening/recheck-27
